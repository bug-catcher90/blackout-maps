        return '<article class="res-clip">' +
          "<h3>" + esc(v.title) + "</h3>" +
          '<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/' + esc(v.id) + '" title="' + esc(v.title) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>' +
          "<p>By <a href=\"" + esc(v.url) + "\">" + esc(v.creator) + "</a>.</p>" +
          "</article>";
      }

      function renderVideos() {
        var list = groups();
        if (!list.length) {
          videos.innerHTML = '<p class="res-empty">No videos.</p>';
          return;
        }
        videos.innerHTML = list.map(function (g) {
          return '<section class="res-group">' +
            '<p class="res-kicker">' + esc(g.cat.title) + "</p>" +
            "<h2>" + esc(g.sub.title) + "</h2>" +
            g.videos.map(clip).join("") +
            "</section>";
        }).join("");
      }

      function renderPicks() {
        var cat = findCat(state.cat);
        catPick.innerHTML = data.map(function (c) {
          return '<option value="' + esc(c.id) + '"' + (c.id === cat.id ? " selected" : "") + ">" + esc(c.title) + "</option>";
        }).join("");
        subPick.innerHTML = cat.subs.map(function (s) {
          return '<option value="' + esc(s.id) + '"' + (s.id === state.sub ? " selected" : "") + ">" + esc(s.title) + "</option>";
        }).join("");
      }

      function renderSide() {
        var open = findCat(state.cat).id;
        side.innerHTML = data.map(function (cat) {
          var opened = cat.id === open;
          var subs = cat.subs.map(function (sub) {
            var current = opened && sub.id === state.sub && !state.q.trim();
            return '<button type="button" data-cat="' + esc(cat.id) + '" data-sub="' + esc(sub.id) + '"' +
              (current ? ' aria-current="true"' : "") + ">" + esc(sub.title) + "</button>";
          }).join("");
          return '<div class="res-cat' + (opened ? " is-open" : "") + '">' +
            '<button type="button" data-open="' + esc(cat.id) + '" aria-expanded="' + (opened ? "true" : "false") + '">' +
            icon(cat.id) + "<span>" + esc(cat.title) + "</span></button>" +
            '<div class="res-subs"' + (opened ? "" : " hidden") + ">" + subs + "</div></div>";
        }).join("");
      }

      function render() {
        document.querySelector(".band").classList.toggle("is-searching", state.q.trim().length > 0);
        renderPicks();
        renderSide();
        renderVideos();
      }

      function choose(catId, subId) {
        var cat = findCat(catId);
        var sub = findSub(cat, subId || cat.subs[0].id);
        state.cat = cat.id;
        state.sub = sub.id;
        state.q = "";
        qInput.value = "";
        if (location.hash) history.replaceState(null, "", location.pathname + location.search);
        render();
      }

      qInput.addEventListener("input", function () {
        state.q = qInput.value;
        document.querySelector(".band").classList.toggle("is-searching", state.q.trim().length > 0);
        renderVideos();
        renderSide();
      });

      document.querySelector(".res-search").addEventListener("submit", function (e) {
        e.preventDefault();
      });

      catPick.addEventListener("change", function () {
        choose(catPick.value, findCat(catPick.value).subs[0].id);
      });

      subPick.addEventListener("change", function () {
        choose(state.cat, subPick.value);
      });

      side.addEventListener("click", function (e) {
        var openBtn = e.target.closest("[data-open]");
        if (openBtn) {
          var id = openBtn.getAttribute("data-open");
          if (state.cat === id) {
            var node = openBtn.closest(".res-cat");
            var box = node.querySelector(".res-subs");
            var willOpen = box.hasAttribute("hidden");
            box.hidden = !willOpen;
            node.classList.toggle("is-open", willOpen);
            openBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
            return;
          }
          choose(id, findCat(id).subs[0].id);
          return;
        }
        var subBtn = e.target.closest("[data-sub]");
        if (subBtn) choose(subBtn.getAttribute("data-cat"), subBtn.getAttribute("data-sub"));
      });

      window.addEventListener("hashchange", function () {
        applyHash();
        state.q = "";
        qInput.value = "";
        render();
      });

      applyHash();
      render();
    })();
  </script>
  <script src="/guides.js"></script>
</body>
</html>
