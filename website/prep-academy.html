 LifeStraw","url":"https://www.youtube.com/@roblifestraw2575"}]}]},{"id":"supplies","title":"What to buy","subs":[{"id":"drinking-water","title":"Drinking water","videos":[{"id":"9w0SHGIh9jM","title":"Which water filter to buy","creator":"Taylor the Nahamsha Hiker","url":"https://www.youtube.com/@TaylortheNahamshaHiker"}]},{"id":"light","title":"Light","videos":[{"id":"g8gNOUWsMoI","title":"How to choose a headlamp that lasts more than one night","creator":"Nitecore","url":"https://www.youtube.com/@NitecoreStore"},{"id":"0HE-XEjuJec","title":"How headlamps compare when you actually use them","creator":"Project Farm","url":"https://www.youtube.com/@ProjectFarm"}]},{"id":"medical","title":"Medical care","videos":[{"id":"y7pvxxx4GB0","title":"What to put in a first aid kit","creator":"Ohio State Wexner Medical Center","url":"https://www.youtube.com/@OSUWexMed"}]},{"id":"food","title":"Food","videos":[{"id":"FCDURxu2L3Y","title":"Which camp stove and fuel to buy","creator":"REI","url":"https://www.youtube.com/@rei"},{"id":"i5o27F8bJ-c","title":"How to pick a stove that boils water for a meal","creator":"Outside","url":"https://www.youtube.com/@OutsideOnline"}]},{"id":"power","title":"Power","videos":[{"id":"gknNrcu20Yo","title":"Which appliances a backup battery can keep running","creator":"Scott Link Media","url":"https://www.youtube.com/@scottlinkmedia"}]},{"id":"shelter","title":"Shelter","videos":[{"id":"4M-f61tbWH4","title":"How to pitch a tarp so the rain runs off","creator":"REI","url":"https://www.youtube.com/@rei"},{"id":"KKN7Ewht1DQ","title":"What to keep at home for cold, water, and a dead phone","creator":"American Red Cross","url":"https://www.youtube.com/@redcross"}]}]}]</script>
  <script>
    (function () {
      var data = JSON.parse(document.getElementById("res-data").textContent);
      var icons = {
        "power-stations": '<path d="M13 2.5 4.8 13.2h6.4l-.8 8.3 8.8-12.2h-6.3L13 2.5z"/>',
        radios: '<path d="M5 12.5a7 7 0 0 1 14 0"/><path d="M8 12.5a4 4 0 0 1 8 0"/><path d="M12 16.2v3.2"/><path d="M9 19.5h6"/>',
        water: '<path d="M12 3.2c2.7 3.5 5 6.2 5 9.1a5 5 0 0 1-10 0c0-2.9 2.3-5.6 5-9.1z"/>',
        supplies: '<path d="M6 8.2h12l-.8 11.2H6.8L6 8.2z"/><path d="M9 8.2V6.6A1.6 1.6 0 0 1 10.6 5h2.8A1.6 1.6 0 0 1 15 6.6v1.6"/>'
      };

      var legacy = {
        "drinking-water": ["water", "filtering"],
        filtering: ["water", "filtering"],
        energy: ["power-stations", "choosing"],
        "power-stations": ["power-stations", "choosing"],
        radios: ["radios", "using"],
        light: ["supplies", "light"],
        food: ["supplies", "food"],
        shelter: ["supplies", "shelter"],
        "medical-care": ["supplies", "medical"]
      };

      var state = { cat: data[0].id, sub: data[0].subs[0].id, q: "" };
      var qInput = document.getElementById("res-q");
      var catPick = document.getElementById("res-cat");
      var subPick = document.getElementById("res-sub");
      var videos = document.getElementById("res-videos");
      var side = document.getElementById("res-side");

      function findCat(id) {
        for (var i = 0; i < data.length; i++) if (data[i].id === id) return data[i];
        return data[0];
      }

      function findSub(cat, id) {
        for (var i = 0; i < cat.subs.length; i++) if (cat.subs[i].id === id) return cat.subs[i];
        return cat.subs[0];
      }

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function icon(name) {
        return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">' + icons[name] + "</svg>";
      }

      function applyHash() {
        var raw = (location.hash || "").replace(/^#/, "");
        if (!raw) return;
        if (legacy[raw]) {
          state.cat = legacy[raw][0];
          state.sub = legacy[raw][1];
          return;
        }
        var parts = raw.split("/");
        var cat = findCat(parts[0]);
        if (cat.id !== parts[0]) return;
        var sub = findSub(cat, parts[1] || cat.subs[0].id);
        state.cat = cat.id;
        state.sub = sub.id;
      }

      function groups() {
        var q = state.q.trim().toLowerCase();
        var out = [];
        if (!q) {
          var cat = findCat(state.cat);
          var sub = findSub(cat, state.sub);
          out.push({ cat: cat, sub: sub, videos: sub.videos });
          return out;
        }
        data.forEach(function (cat) {
          cat.subs.forEach(function (sub) {
            var topic = (cat.title + " " + sub.title).toLowerCase().indexOf(q) !== -1;
            var list = sub.videos.filter(function (v) {
              if (topic) return true;
              return (v.title + " " + v.creator).toLowerCase().indexOf(q) !== -1;
            });
            if (list.length) out.push({ cat: cat, sub: sub, videos: list });
          });
        });
        return out;
      }

      function clip(v) {
        return '<article class="res-clip">' +
          "<h3>" + esc(v.title) + "</h3>" +
          '<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/' + esc(v.id) + '" title="' + esc(v.title) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>' +
          "<p>By <a href=\"" + esc(v.url) + "\">" + esc(v.creator) + "</a>.</p>" +
          "</article>";
      }

      function renderVideos() {
        var list = groups();
        if (!list.length) {
          videos.innerHTML = '<p class="res-empty">No videos.</p>';
          return;
        }
        videos.innerHTML = list.map(function (g) {
          return '<section class="res-group">' +
            '<p class="res-kicker">' + esc(g.cat.title) + "</p>" +
            "<h2>" + esc(g.sub.title) + "</h2>" +
            g.videos.map(clip).join("") +
            "</section>";
        }).join("");
      }

      function renderPicks() {
        var cat = findCat(state.cat);
        catPick.innerHTML = data.map(function (c) {
          return '<option value="' + esc(c.id) + '"' + (c.id === cat.id ? " selected" : "") + ">" + esc(c.title) + "</option>";
        }).join("");
        subPick.innerHTML = cat.subs.map(function (s) {
          return '<option value="' + esc(s.id) + '"' + (s.id === state.sub ? " selected" : "") + ">" + esc(s.title) + "</option>";
        }).join("");
      }

      function renderSide() {
        var open = findCat(state.cat).id;
        side.innerHTML = data.map(function (cat) {
          var opened = cat.id === open;
          var subs = cat.subs.map(function (sub) {
            var current = opened && sub.id === state.sub && !state.q.trim();
            return '<button type="button" data-cat="' + esc(cat.id) + '" data-sub="' + esc(sub.id) + '"' +
              (current ? ' aria-current="true"' : "") + ">" + esc(sub.title) + "</button>";
          }).join("");
          return '<div class="res-cat' + (opened ? " is-open" : "") + '">' +
            '<button type="button" data-open="' + esc(cat.id) + '" aria-expanded="' + (opened ? "true" : "false") + '">' +
            icon(cat.id) + "<span>" + esc(cat.title) + "</span></button>" +
            '<div class="res-subs"' + (opened ? "" : " hidden") + ">" + subs + "</div></div>";
        }).join("");
      }

      function render() {
        document.querySelector(".band").classList.toggle("is-searching", state.q.trim().length > 0);
        renderPicks();
        renderSide();
        renderVideos();
      }

      function choose(catId, subId) {
        var cat = findCat(catId);
        var sub = findSub(cat, subId || cat.subs[0].id);
        state.cat = cat.id;
        state.sub = sub.id;
        state.q = "";
        qInput.value = "";
        if (location.hash) history.replaceState(null, "", location.pathname + location.search);
        render();
      }

      qInput.addEventListener("input", function () {
        state.q = qInput.value;
        document.querySelector(".band").classList.toggle("is-searching", state.q.trim().length > 0);
        renderVideos();
        renderSide();
      });

      document.querySelector(".res-search").addEventListener("submit", function (e) {
        e.preventDefault();
      });

      catPick.addEventListener("change", function () {
        choose(catPick.value, findCat(catPick.value).subs[0].id);
      });

      subPick.addEventListener("change", function () {
        choose(state.cat, subPick.value);
      });

      side.addEventListener("click", function (e) {
        var openBtn = e.target.closest("[data-open]");
        if (openBtn) {
          var id = openBtn.getAttribute("data-open");
          if (state.cat === id) {
            var node = openBtn.closest(".res-cat");
            var box = node.querySelector(".res-subs");
            var willOpen = box.hasAttribute("hidden");
            box.hidden = !willOpen;
            node.classList.toggle("is-open", willOpen);
            openBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
            return;
          }
          choose(id, findCat(id).subs[0].id);
          return;
        }
        var subBtn = e.target.closest("[data-sub]");
        if (subBtn) choose(subBtn.getAttribute("data-cat"), subBtn.getAttribute("data-sub"));
      });

      window.addEventListener("hashchange", function () {
        applyHash();
        state.q = "";
        qInput.value = "";
        render();
      });

      applyHash();
      render();
    })();
  </script>

</body>
