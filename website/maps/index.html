<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Posição" />
    <meta name="theme-color" content="#fffcf8" />
    <title>Posição</title>
    <link rel="manifest" href="/maps/manifest.webmanifest" />
    <link rel="icon" href="/maps/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/maps/icons/icon-180.png" />
    <link rel="stylesheet" href="/maps/vendor/maplibre-gl.css" />
    <link rel="stylesheet" href="/maps/styles.css" />
  </head>
  <body>
    <div id="map"></div>
    <div id="center-dot" class="center-dot" hidden aria-hidden="true"></div>
    <div id="center-pin" class="center-pin" hidden aria-hidden="true">
      <svg viewBox="0 0 24 36" aria-hidden="true"><path d="M12 1.5a10 10 0 0 0-10 10c0 7.2 10 22.5 10 22.5S22 18.7 22 11.5A10 10 0 0 0 12 1.5z" fill="#c2410c" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="11.5" r="3.2" fill="#fff"/></svg>
    </div>

    <div id="top" class="top">
      <div id="search" class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.25" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M15.6 15.6 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <input id="query" type="text" placeholder="Pesquisar" aria-label="Pesquisar" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button type="button" id="clear" class="clear" hidden aria-label="Limpar">×</button>
      </div>
      <div id="categories" class="categories" hidden></div>
      <p id="status" class="status" hidden>A guardar mapa</p>
      <ul id="results" class="results" hidden></ul>
    </div>

    <div id="tools" class="tools">
      <div class="compass-row">
      <p id="position-prompt" class="position-prompt" hidden></p>
      <button type="button" id="fix-btn" aria-label="Posição" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M12 4.7 14.3 12 12 10.5 9.7 12Z" fill="#c2410c" />
          <path d="M12 19.3 9.7 12 12 13.5 14.3 12Z" fill="currentColor" />
        </svg>
      </button>
      </div>
    </div>

    <section id="nav-banner" class="nav-banner" hidden>
      <div id="nav-arrow" class="nav-arrow" data-turn="straight">
        <svg data-icon="straight" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 40 V16" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M24 6 33 18H15Z" fill="currentColor"/></svg>
        <svg data-icon="slight-left" viewBox="0 0 48 48" aria-hidden="true"><path d="M30 42 V26 C28 18 20 16 14 12" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M20 6 8 10 16 20Z" fill="currentColor"/></svg>
        <svg data-icon="left" viewBox="0 0 48 48" aria-hidden="true"><path d="M32 42 V20 H16" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12 6 20 20 28Z" fill="currentColor"/></svg>
        <svg data-icon="sharp-left" viewBox="0 0 48 48" aria-hidden="true"><path d="M32 42 V22 C32 14 24 12 18 18 L12 28" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M18 24 6 32 20 36Z" fill="currentColor"/></svg>
        <svg data-icon="slight-right" viewBox="0 0 48 48" aria-hidden="true"><path d="M18 42 V26 C20 18 28 16 34 12" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M28 6 40 10 32 20Z" fill="currentColor"/></svg>
        <svg data-icon="right" viewBox="0 0 48 48" aria-hidden="true"><path d="M16 42 V20 H32" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 12 42 20 28 28Z" fill="currentColor"/></svg>
        <svg data-icon="sharp-right" viewBox="0 0 48 48" aria-hidden="true"><path d="M16 42 V22 C16 14 24 12 30 18 L36 28" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M30 24 42 32 28 36Z" fill="currentColor"/></svg>
        <svg data-icon="uturn" viewBox="0 0 48 48" aria-hidden="true"><path d="M16 42 V18 C16 10 32 10 32 18 V30" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M24 26 32 40 40 26Z" fill="currentColor"/></svg>
        <svg data-icon="roundabout" viewBox="0 0 48 48" aria-hidden="true"><circle cx="20" cy="26" r="8" fill="none" stroke="currentColor" stroke-width="4"/><path d="M20 42 V34 M28 26 H36" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M32 18 44 26 32 34Z" fill="currentColor"/></svg>
      </div>
      <div class="nav-copy">
        <p id="nav-distance"></p>
        <p id="nav-step">Siga em frente</p>
      </div>
    </section>

    <button type="button" id="recenter" class="recenter" hidden>Recentrar</button>

    <section id="trip" class="trip" hidden>
      <div class="trip-head">
        <h2 id="trip-title">A pé</h2>
        <button type="button" id="trip-close" aria-label="Fechar">×</button>
      </div>
      <div class="modes" role="group" aria-label="Modo">
        <button type="button" data-mode="walk" aria-pressed="true" aria-label="A pé">
          <span class="mode-time"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="14" cy="4.8" r="1.5" fill="currentColor" />
            <path d="M13.2 8.2 10.6 14.2l-2.2 1.2M13.2 8.2 16.4 12.2 18.6 18M10.6 14.2 12 19.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button type="button" data-mode="car" aria-pressed="false" aria-label="De carro">
          <span class="mode-time"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 15.5 6.4 10h11.2L19 15.5M5 15.5h14V18H5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <circle cx="8" cy="18" r="1.3" fill="currentColor" />
            <circle cx="16" cy="18" r="1.3" fill="currentColor" />
          </svg>
        </button>
        <button type="button" data-mode="bicycle" aria-pressed="false" aria-label="De bicicleta">
          <span class="mode-time"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="6.5" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6" />
            <circle cx="17.5" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M6.5 16 11 8h4l2.5 8M11 8 9 12.2h5.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      <p id="trip-name" class="trip-name" hidden></p>
      <p id="trip-duration" class="trip-duration"></p>
      <p id="trip-meta" class="trip-meta"></p>
      <p id="trip-coords" class="trip-meta"></p>
      <div id="route-cards" class="route-cards" hidden></div>
      <div class="trip-actions">
        <button type="button" id="start" disabled>Iniciar</button>
        <button type="button" id="routes-btn">Direções</button>
      </div>
      <ul id="route-list" class="results" hidden></ul>
    </section>

    <section id="nav-card" class="nav-card" hidden>
      <button type="button" id="nav-overview" aria-label="Ver percurso">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21 V11.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <path d="M12 12.5 6.2 5.2M12 12.5 17.8 5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <path d="M6.2 5.2 6.5 8.4M6.2 5.2 9.2 5.6M17.8 5.2 17.5 8.4M17.8 5.2 14.8 5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
      <div class="nav-mid">
        <p id="nav-time"></p>
        <p id="nav-meta"></p>
      </div>
      <button type="button" id="nav-exit">Sair</button>
      <button type="button" id="nav-correct">Corrigir posição</button>
    </section>

    <section id="correct-bar" class="correct-bar" hidden>
      <button type="button" id="correct-cancel">Cancelar</button>
      <button type="button" id="correct-ok">Confirmar</button>
    </section>

    <section id="fix-bar" class="fix-bar" hidden>
      <p id="fix-name" hidden></p>
      <p id="fix-address" class="result-detail" hidden></p>
      <p id="fix-coords" class="result-detail"></p>
      <div class="fix-actions">
        <button type="button" id="fix-cancel">Cancelar</button>
        <button type="button" id="fix-ok">Confirmar</button>
      </div>
    </section>

    <section id="sheet-places" class="sheet" hidden aria-label="Lugares">
      <div class="sheet-head">
        <h2 id="places-title"></h2>
        <button type="button" id="places-close" aria-label="Fechar">×</button>
      </div>
      <ul id="places-list" class="results"></ul>
    </section>

    <section id="place-card" class="card" hidden>
      <p id="place-name"></p>
      <div class="actions">
        <button type="button" id="save-pin">Guardar</button>
        <button type="button" id="go-dir">Direções</button>
      </div>
    </section>

    <section id="save-card" class="card" hidden>
      <p id="save-name" hidden></p>
      <p id="save-address" class="result-detail" hidden></p>
      <p id="save-coords" class="result-detail"></p>
      <button type="button" id="save-place" disabled>Guardar</button>
    </section>

    <section id="sheet-pin" class="sheet" hidden aria-label="Posição">
      <ul id="pin-results" class="results" hidden></ul>
      <button type="button" id="anchor" disabled>Fixar posição</button>
    </section>

    <section id="panel-pins" class="panel" hidden aria-label="Pins">
      <ul id="pin-list" class="list"></ul>
      <button type="button" id="add-pin">Adicionar</button>
    </section>

    <section id="panel-settings" class="panel" hidden aria-label="Definições">
      <div class="settings-block">
        <p class="settings-label" id="maps-label">Mapas</p>
        <div id="installed-maps"></div>
        <button type="button" id="import-maps" class="settings-link">
          <span id="import-maps-label">Importar mapas</span>
          <span aria-hidden="true">›</span>
        </button>
      </div>
      <div class="settings-block">
        <p class="settings-label" id="sensors-heading">Sensores</p>
        <label class="toggle">
          <span id="sensors-label">Sensores</span>
          <input id="sensors" type="checkbox" />
        </label>
        <label class="step">
          <span id="step-label">Passo base</span>
          <input id="step" type="range" min="0.4" max="1.2" step="0.05" value="0.7" />
          <span id="step-value">0,70 m</span>
        </label>
      </div>
      <div class="settings-block">
        <p class="settings-label" id="legal-label">Legal</p>
        <a class="settings-link" id="privacy-link" href="/privacy.html"><span>Política de privacidade</span><span aria-hidden="true">›</span></a>
        <a class="settings-link" id="terms-link" href="/terms.html"><span>Termos de utilização</span><span aria-hidden="true">›</span></a>
      </div>
    </section>

    <section id="sheet-import" class="panel import" hidden aria-label="Importar mapas">
      <div class="sheet-head">
        <h2 id="import-title">Importar mapas</h2>
        <button type="button" id="import-close" aria-label="Fechar">×</button>
      </div>
      <p id="import-note" class="hint" hidden></p>
      <div id="catalog-list"></div>
    </section>

    <nav class="tabbar" aria-label="Secções">
      <a class="home" href="/" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 11.2 12 4.5l8 6.7V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        </svg>
      </a>
      <button type="button" data-tab="explorar" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21s6-5.2 6-10a6 6 0 0 0-12 0c0 4.8 6 10 6 10Z" fill="none" stroke="currentColor" stroke-width="1.7" />
          <circle cx="12" cy="11" r="2" fill="currentColor" />
        </svg>
        Explorar
      </button>
      <button type="button" data-tab="pins">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 4.5h10a1 1 0 0 1 1 1V20l-6-3.2L6 20V5.5a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        </svg>
        Pins
      </button>
      <button type="button" data-tab="definicoes">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7" />
          <path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
        Definições
      </button>
    </nav>

    <script src="/maps/vendor/pmtiles.js"></script>
    <script type="module" src="/maps/app.js?v=38"></script>
  </body>
</html>
